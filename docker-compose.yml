version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: logistics-mysql

    restart: always

    ports:
      - "3309:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: logistics_cms
      MYSQL_USER: logistics_user
      MYSQL_PASSWORD: logistics123

    volumes:
      - mysql_data:/var/lib/mysql

    command:
      --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: