spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: 60s

server:
  port: ${PORT:8111}
  tomcat:
    connection-timeout: 20s
    connection-upload-timeout: 120s
    max-connections: 200
    accept-count: 50

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
